[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seguidores-instagram"
version = "0.2.2"
description = "Monitor local y multiplataforma de seguidores de Instagram"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas De Bortoli" }]
dependencies = [
  "browser-cookie3>=0.20.1,<1",
  "instaloader>=4.14,<5",
  "keyring>=25,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]
build-app = [
  "pyinstaller>=6.21,<7",
]

[project.scripts]
seguidores = "seguidores.cli:main"

[project.gui-scripts]
seguidores-gui = "seguidores.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seguidores"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
