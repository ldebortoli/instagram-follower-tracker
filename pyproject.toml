[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seguidores-instagram"
version = "0.3.0"
description = "Monitor local y multiplataforma de seguidores de Instagram"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas De Bortoli" }]
dependencies = [
  "browser-cookie3>=0.20.1,<1",
  "instaloader>=4.14,<5",
  "keyring>=25,<27",
  "requests>=2.25,<3",
]

[project.optional-dependencies]
dev = [
  "python-telegram-bot[job-queue]>=22.8,<23",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]
build-app = [
  "pyinstaller>=6.21,<7",
]
bot = [
  "python-telegram-bot[job-queue]>=22.8,<23",
]

[project.scripts]
seguidores = "seguidores_desktop.cli:main"
jo-bot = "jo_bot.app:main"
jobot = "jo_bot.app:local_main"

[project.gui-scripts]
seguidores-gui = "seguidores_desktop.gui:main"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/core/src/seguidores",
  "apps/desktop/src/seguidores_desktop",
  "apps/jo-bot/src/jo_bot",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
  "packages/core/tests",
  "apps/desktop/tests",
  "apps/jo-bot/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
